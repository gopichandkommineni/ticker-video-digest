# Hierarchical keyword taxonomy for tweet classification
# Structure: theme > sub_theme > keywords (with weights 1/3/5)
#
# Weight guide:
#   5 = anchor   — highly specific, rarely appears outside this sub_theme
#   3 = strong   — clearly associated, occasionally shared across sub_themes
#   1 = context  — supporting signal only, not enough alone
#
# Rules:
#   - All matching is case-insensitive, whole-word (word-boundary aware)
#   - Phrases (multi-word) are matched before single words
#   - Minimum score to assign a sub_theme: 3
#   - A tweet can match multiple sub_themes (within or across themes)

