stories:
  - title: "The migration I nearly broke"
    skills: [design.systems.migration, design.systems.consistency, design.org.ownership]
    situation: >
      Fourteen months into moving orders off the monolith, reconciliation fell
      six hours behind during a Black Friday spike and the two stores diverged
      on ~4,000 live orders.
    what_you_did: >
      Froze writes to the new path rather than rolling back — a rollback would
      have been cleaner operationally but would have lost 6h of new-path data
      we needed to diagnose the divergence. Rebuilt state from the event log,
      then added backpressure to the retry queue whose unboundedness I had
      designed in a year earlier.
    outcome: >
      90 minutes to recovery, no customer-visible impact, no recurrence in the
      18 months since. The postmortem changed how the org reviews queue design.
    what_youd_do_differently: >
      I designed the retry queue without a bound because the failure mode felt
      theoretical at our volume. It was theoretical right up until it wasn't.
      I now treat "unbounded" as a design smell rather than a default.

not_pursuing:
  - skill: craft.cpp
    reason: "Deliberate. Going deeper on distributed systems design instead."
  - skill: domain.ads
    reason: "Not interested in the domain; would not be credible pretending."
