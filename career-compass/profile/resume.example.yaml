# ═══════════════════════════════════════════════════════════════════════════
#  FICTIONAL EXAMPLE — not a real person, not your data.
#
#  Here purely to show the SHAPE of a well-filled profile: the level of
#  specificity that makes gap analysis useful, and what an honest mix of
#  strong and weak claims looks like. Copy resume.template.yaml, not this.
#
#  Note in particular:
#    * claim #3 — rating 4, zero evidence. That is the pattern the system
#      exists to catch, and its prep item will be "write", not "build".
#    * every impact_metric carries a number.
#    * not_pursuing is used, so settled decisions stop resurfacing.
# ═══════════════════════════════════════════════════════════════════════════

