claims:
  # ── strong, well-evidenced ──────────────────────────────────────────────
  - skill: design.systems.migration
    self_rating: 5
    last_used: 2024
    notes: >
      Strongest area. Two large migrations start to finish, one of which I
      designed and one I inherited half-done, which taught me more.
    evidence:
      - kind: system
        title: "Order monolith → service decomposition"
        date: "2023-11"
        description: >
          14-month strangler-fig migration of the order lifecycle out of a
          9-year-old Rails monolith. Constraint was zero customer-visible
          downtime and no code freeze — the business would not accept either.
          Chose dual-write with async reconciliation over a big-bang cutover,
          accepting ~6 weeks of double storage cost to keep rollback possible
          at every step. Rolled back twice; both times in under 20 minutes.
        impact_metric: "0 downtime incidents across 14 months; p99 checkout 2.1s → 640ms"
        confidence: high
      - kind: design_doc
        title: "Dual-write reconciliation design"
        date: "2022-09"
        description: >
          The doc the migration ran on. Reviewed by 3 teams; the reconciliation
          approach was adopted by the payments team afterward.
        confidence: high
      - kind: incident
        title: "Reconciliation lag postmortem"
        date: "2023-04"
        description: >
          Led the response when reconciliation fell 6h behind during a traffic
          spike and orders diverged. Root cause was an unbounded retry queue I
          had designed. Wrote the postmortem, added backpressure.
        impact_metric: "Recovery in 90 minutes; no recurrence in 18 months"
        confidence: high

  - skill: design.systems.api_design
    self_rating: 4
    last_used: 2025
    evidence:
      - kind: system
        title: "Order API v2"
        date: "2024-06"
        description: >
          Designed the versioning and deprecation strategy for a public-facing
          order API with 40+ internal consumers. Chose additive-only evolution
          with a 12-month deprecation window over hard versioning.
        impact_metric: "Migrated 40 consumers in 9 months; 0 breaking-change incidents"
        confidence: high
      - kind: writing
        title: "Why we don't version our APIs"
        date: "2024-08"
        description: "Internal deep-dive, later published on the company blog."
        url: "https://example.com/blog/api-versioning"
        confidence: medium

  # ── the pattern this system exists to catch ─────────────────────────────
  - skill: design.systems.consistency
    self_rating: 4
    last_used: 2023
    notes: >
      I have genuinely done this work — the reconciliation design above is
      squarely a consistency problem — but I have never written it up AS a
      consistency problem, and I fumble the vocabulary when asked cold.
    evidence: []
    # → supply scores low despite the 4. The generated prep item will be
    #   "write", not "build", because the work exists and is illegible.

