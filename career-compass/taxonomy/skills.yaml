        aliases: [machine learning, deep learning, recommendation model,
                  ranking model, transformer, fine-tuning, PyTorch,
                  loss function]
        leaves: [ranking, deep_learning, finetuning]

  # ═══════════════════════════════════════════════════════════════════════
  - slug: domain
    name: Domain knowledge
    description: >
      Company-shaped context. Hardest branch to close by studying — you close
      it by being adjacent to the work — hence the low closability prior. The
      system's honest advice for a large domain gap is usually "lead with
      something else".
    skills:
      - slug: domain.video
        name: Video & streaming
        aliases: [video streaming, encoding, transcoding, codec, ABR,
                  adaptive bitrate, HLS, DASH, playback, QoE, CDN delivery,
                  Open Connect]
        leaves: [encoding, playback, delivery]

      - slug: domain.recsys
