[project]
name = "career-compass"
version = "0.1.0"
description = "Personal career intelligence: target companies, their engineering signal, and my gaps against it."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",     # fast HTML → text; no lxml build step
    "anthropic>=0.40",
    "rich>=13.7",          # the CLI is the primary surface; it should read well
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "pandas>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

[project.scripts]
career = "career_compass.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No network in unit tests, ever. Fixtures live in tests/fixtures/.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
