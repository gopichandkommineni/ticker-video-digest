name: weekly-brief

on:
  schedule:
    - cron: "0 13 * * 1"      # Mondays, 13:00 UTC
  workflow_dispatch:

concurrency:
  group: career-refresh       # shares the single-writer lock with daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m career_compass.jobs.weekly_brief
      - run: |
          git config user.name  "career-compass[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add -A briefs/ || true
          git diff --staged --quiet || git commit -m "docs: weekly brief $(date -u +%G-W%V)"
          git push
