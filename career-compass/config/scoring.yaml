# All the numbers. Every constant in the scoring model lives here and nowhere
# else, so that being wrong about the thesis costs one edit and a re-run
# rather than a rewrite. See docs/05-gap-scoring.md and ADR-0005.

version: 1

# Which extraction version analysis reads. Producing newer extractions is safe
# and invisible until this pin moves (ADR-0007).
extractor_version: doc-v1
schema_version: 1
taxonomy_version: 1

# ── The thesis, as seven numbers ──────────────────────────────────────────
# This is the whole "design > craft" bet. If it is wrong, change it here.
branch_weights:
  design.systems: 1.00
  design.product: 0.90
  design.org: 0.80
  ai: 0.80
  domain: 0.70
  platform: 0.50
  craft: 0.30

# ── Demand ────────────────────────────────────────────────────────────────
role_weights:
  requirement: 1.0        # "you must have..."  — an actual hiring bar
  described_system: 0.6   # "we run..."          — they do it; may not hire for it
  aspiration: 0.5         # "we're moving to..." — leading indicator
  nice_to_have: 0.4       # "bonus if..."

# Set target_level to the level you are aiming at. Mentions at that level
# count fully; adjacent levels count less.
target_level: senior
level_weights:
  principal: 0.7
  staff: 0.9
  senior: 1.0
  mid: 0.6
  junior: 0.2
  unknown: 0.7            # most postings won't parse cleanly; don't punish

source_weights:
  job_posting: 1.0
  note: 0.9               # manual intel — scaled further by `confidence`
  talk: 0.7
  blog_post: 0.7
  repo: 0.5

# Exponential decay half-lives in days (ADR-0009).
half_life_days:
  job_posting: 120
  note: 240
  blog_post: 400
  talk: 400
  repo: 550

# A theme in one long blog post is one data point, not twelve.
# multiplier = min(1.0, base + step * distinct_source_count)
distinct_source_guard:
  base: 0.50
  step: 0.25

# Window for the headline demand number, and the comparison window for trend.
demand_window_days: 365
trend_window_days: 90

# ── Supply ────────────────────────────────────────────────────────────────
supply_weights:
  rating: 0.35
  evidence: 0.50
  recency: 0.15

# The load-bearing rule (ADR-0008): a self-rating with no artifact behind it
# cannot contribute more than this. Unevidenced confidence is not supply.
unevidenced_rating_cap: 0.4

evidence_weights:
  system: 1.0             # shipped and owned — the strongest claim available
  design_doc: 0.9
  incident: 0.8           # led the response or wrote the postmortem
  writing: 0.7
  talk: 0.7
  pr: 0.5
  course: 0.2             # exposure, not evidence

impact_metric_multiplier: 1.3   # numbers are what survive an interview
evidence_saturation_k: 3        # diminishing returns past ~3 strong artifacts
skill_recency_half_life_years: 4

# ── Leverage ──────────────────────────────────────────────────────────────
# gap      = demand * (1 - supply/100)      "how much this hurts"
# leverage = gap * closability              "what to actually do next"
#
# The honest consequence: domain gaps show large and score low-leverage,
# because you do not close them by studying. That is more useful than a study
# plan that cannot work.
closability:
  craft: 0.9
  platform: 0.7
  ai: 0.7
  design.systems: 0.5
  design.product: 0.4
  domain: 0.3
  design.org: 0.2

# Per-skill overrides where the branch prior is clearly wrong for you.
closability_overrides: {}
  # design.systems.consistency: 0.7   # already adjacent; closable with one project

# ── Output ────────────────────────────────────────────────────────────────
report:
  top_gaps_per_company: 12
  prep_items_per_cycle: 5
  min_evidence_count_to_show_as_strength: 1
  # Deliberately absent: any single blended "readiness %". False precision,
  # and I would optimize the number instead of the career.
