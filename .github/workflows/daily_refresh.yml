name: Daily Refresh

on:
  schedule:
    - cron: "0 13 * * *"  # 1pm UTC (~9am ET), after market data settles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run daily refresh
        run: python -m casino_dashboard.jobs.daily_refresh

      - name: Commit snapshots.db if changed
        run: |
          git config user.name "casino-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots.db
          git commit -m "Daily refresh: $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
