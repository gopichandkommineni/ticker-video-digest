name: Daily Refresh

on:
  schedule:
    - cron: "0 6 * * *"      # 2am ET — single overnight refresh (market closed)
    - cron: "0 13 * * 1-5"   # 9am ET — pre-market refresh (before 9:30am open)
    - cron: "0 17 * * 1-5"   # 1pm ET — mid-session refresh (~4h after open)
    - cron: "0 21 * * 1-5"   # 5pm ET — post-close refresh (after 4pm close)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run daily refresh
        run: python -m casino_dashboard.jobs.daily_refresh

      - name: Commit snapshots.db if changed
        run: |
          git config user.name "casino-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots.db
          git commit -m "Refresh: $(date -u +%Y-%m-%dT%H:%M)Z" || echo "No changes"
          git push
