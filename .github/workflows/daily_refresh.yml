name: Daily Refresh — Market Data & Signals

# Extracts prices, social mentions, metadata, ETF flows, deal log, sector heat,
# and congress trades into data/snapshots.db, then commits the updated DB to main.
# Each run posts a summary report under the Actions run ("Summary" tab).

on:
  schedule:
    - cron: "0 6 * * *"      # 2am ET — overnight refresh (market closed)
    - cron: "0 13 * * 1-5"   # 9am ET — pre-market refresh (before 9:30am open)
    - cron: "0 17 * * 1-5"   # 1pm ET — mid-session refresh (~4h after open)
    - cron: "0 21 * * 1-5"   # 5pm ET — post-close refresh (after 4pm close)
  workflow_dispatch:           # also runnable on demand from the Actions tab

# Only one DB-writing job runs at a time. Every workflow that commits to
# snapshots.db / fintwit.db shares this group so their commits never race;
# queued runs wait their turn instead of being cancelled.
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      REDDIT_PROXY: ${{ secrets.REDDIT_PROXY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Extract market data & write run report
        run: python -m casino_dashboard.jobs.daily_refresh

      - name: Commit updated snapshots.db to main
        run: |
          test -f data/snapshots.db || { echo "data/snapshots.db not present — nothing to commit"; exit 0; }
          git config user.name "casino-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage only the DB file — never `git add -A`, which would sweep up
          # stray files and pollute the branch.
          git add data/snapshots.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Absorb any commit that landed while we ran before pushing
          # (the db-writer concurrency group makes a race rare, not impossible).
          git pull --rebase origin main
          git push origin HEAD:main
