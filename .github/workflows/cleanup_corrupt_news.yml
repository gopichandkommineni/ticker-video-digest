name: One-time Cleanup — Corrupt news_items

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Delete corrupted news_items rows
        run: python scripts/cleanup_corrupt_news.py

      - name: Commit snapshots.db if changed
        run: |
          git config user.name "casino-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots.db
          git commit -m "One-time cleanup: remove corrupted news_items rows" || echo "No changes"
          git push
