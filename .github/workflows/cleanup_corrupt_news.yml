name: Maintenance — Remove Corrupt News Rows

# On-demand one-off: deletes corrupted rows from the news_items table in
# data/snapshots.db and commits the cleaned DB. Runs in the db-writer queue so
# it never races the Daily Refresh, which also writes snapshots.db.

on:
  workflow_dispatch:

# Share the db-writer queue with Daily Refresh so two jobs never write
# snapshots.db at the same time.
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Delete corrupted news_items rows
        run: python scripts/cleanup_corrupt_news.py

      - name: Commit cleaned snapshots.db to main
        run: |
          test -f data/snapshots.db || { echo "data/snapshots.db not present — nothing to commit"; exit 0; }
          git config user.name "casino-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage only the DB file — never git add -A.
          git add data/snapshots.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Maintenance: remove corrupted news_items rows"
          # Absorb any commit that landed while we ran before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
