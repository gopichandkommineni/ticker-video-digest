name: FinTwit — Manual Handle Backfill

# On-demand: pulls the full tweet history for one handle into data/fintwit.db
# and commits it. Use this to add a new handle or fill gaps the daily ingest
# missed. Posts a summary report under the Actions run ("Summary" tab).

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "Twitter handle(s) to backfill, without @ (comma-separated for several)"
        required: true
        type: string
      since:
        description: "Optional gap-fill start date YYYY-MM-DD (use with 'until' to fill an interior gap)"
        required: false
        type: string
      until:
        description: "Optional gap-fill end date YYYY-MM-DD (use with 'since')"
        required: false
        type: string
      reset_failed:
        description: "Re-open terminally-failed day-slots in the window before backfilling (resume days that maxed out attempts on a provider outage, e.g. HTTP 402). Requires since/until."
        required: false
        default: false
        type: boolean
      chunk_days:
        description: "For a windowed backfill (since+until), commit+push every N days so a mid-run crash/timeout keeps completed chunks instead of losing the whole run. Smaller N = safer but more DB snapshots in git history. Default 7."
        required: false
        default: "7"
        type: string

# Same db-writer queue as the other DB-writing workflows (see Daily Refresh).
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      # Write API keys to a .env file in the working dir; the scripts load it
      # with load_dotenv(".env"). Keys never appear in logs.
      - name: Write .env from secrets
        run: |
          printf 'GETXAPI_KEY=%s\n'        "${{ secrets.GETXAPI_KEY }}"        > .env
          printf 'TWITTERAPI_IO_KEY=%s\n'  "${{ secrets.TWITTERAPI_IO_KEY }}"  >> .env

      # One-time (idempotent) shrink: drop the stored raw_json payloads that
      # pushed data/fintwit.db past GitHub's 100MB limit. After the first run
      # clears them this is a no-op (0 rows changed → VACUUM skipped).
      - name: Shrink DB (drop raw_json)
        env:
          PYTHONPATH: src
        run: python scripts/shrink_fintwit_db.py

      - name: Backfill handle & write run report
        id: backfill
        env:
          PYTHONPATH: src
          # Backfill runs on twitterapi only (credits account). Single-provider
          # runs reconcile a lone terminal day straight to 'ok' (see
          # reconciler.reconcile_completed_days). Cross-provider verification is
          # intentionally skipped here; the daily delta uses getxapi.
          WORKER_POOL_SIZES: '{"twitterapi": 5}'
        run: |
          set -euo pipefail
          git config user.name  "fintwit-bot"
          git config user.email "bot@users.noreply.github.com"

          HANDLE="${{ inputs.handle }}"
          SINCE="${{ inputs.since }}"
          UNTIL="${{ inputs.until }}"
          CHUNK_DAYS="${{ inputs.chunk_days }}"
          CHUNK_DAYS="${CHUNK_DAYS:-7}"
          RESET=""
          if [ "${{ inputs.reset_failed }}" = "true" ]; then RESET="--reset-failed"; fi

          # Commit + push the DB as it currently stands. Stages ONLY the DB file.
          # Each chunk ran as its own process, so WAL is already checkpointed and
          # the committed .db is at rest (a consistent snapshot).
          commit_push() {
            git add data/fintwit.db
            if git diff --cached --quiet; then
              echo "  (no DB change to commit for $1)"
            else
              git commit -m "FinTwit backfill ${HANDLE} ${1}"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          # No window → single backfill-or-delta run. Chunking only applies to an
          # explicit [since, until] range; the final commit step persists it.
          if [ -z "$SINCE" ] || [ -z "$UNTIL" ]; then
            python scripts/run_backfill.py "$HANDLE"
            exit 0
          fi

          # Windowed: walk [SINCE, UNTIL] in CHUNK_DAYS-day slices and commit each
          # so a mid-run crash/timeout keeps every completed chunk on origin
          # instead of losing the whole run. run_backfill is idempotent per
          # window (already-ok days are skipped), and --reset-failed is scoped to
          # each chunk's dates.
          CUR="$SINCE"
          while [ "$(date -d "$CUR" +%s)" -le "$(date -d "$UNTIL" +%s)" ]; do
            END="$(date -d "$CUR +$((CHUNK_DAYS - 1)) days" +%Y-%m-%d)"
            if [ "$(date -d "$END" +%s)" -gt "$(date -d "$UNTIL" +%s)" ]; then
              END="$UNTIL"
            fi
            echo "=== chunk ${CUR} → ${END} ==="
            python scripts/run_backfill.py "$HANDLE" --since "$CUR" --until "$END" $RESET
            commit_push "${CUR}..${END}"
            CUR="$(date -d "$END +1 day" +%Y-%m-%d)"
          done

      # Backstop: runs even if the backfill step failed mid-chunk (if: always).
      # Commits any DB changes the loop didn't reach (a crashed chunk's partial
      # writes, or the no-window path) AND flushes any chunk that was committed
      # locally but whose push failed — so partial progress always reaches
      # origin. Stages only the DB file, never `git add -A`.
      - name: Commit any remaining fintwit.db changes to main
        if: always()
        run: |
          test -f data/fintwit.db || { echo "data/fintwit.db not present — nothing to commit"; exit 0; }
          git config user.name  "fintwit-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage only the DB file — never git add -A.
          git add data/fintwit.db
          if git diff --cached --quiet; then
            echo "No new DB changes to stage"
          else
            git commit -m "FinTwit backfill ${{ inputs.handle }}: $(date -u +%Y-%m-%dT%H:%M)Z"
          fi
          # Always reconcile with origin and push: this flushes any locally
          # committed-but-unpushed chunk. A true no-op push is harmless.
          git pull --rebase origin main
          git push origin HEAD:main || echo "nothing to push"
