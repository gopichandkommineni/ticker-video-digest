name: FinTwit — Manual Handle Backfill

# On-demand: pulls the full tweet history for one handle into data/fintwit.db
# and commits it. Use this to add a new handle or fill gaps the daily ingest
# missed. Posts a summary report under the Actions run ("Summary" tab).

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "Twitter handle(s) to backfill, without @ (comma-separated for several)"
        required: true
        type: string
      since:
        description: "Optional gap-fill start date YYYY-MM-DD (use with 'until' to fill an interior gap)"
        required: false
        type: string
      until:
        description: "Optional gap-fill end date YYYY-MM-DD (use with 'since')"
        required: false
        type: string
      reset_failed:
        description: "Re-open terminally-failed day-slots in the window before backfilling (resume days that maxed out attempts on a provider outage, e.g. HTTP 402). Requires since/until."
        required: false
        default: false
        type: boolean

# Same db-writer queue as the other DB-writing workflows (see Daily Refresh).
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      # Write API keys to a .env file in the working dir; the scripts load it
      # with load_dotenv(".env"). Keys never appear in logs.
      - name: Write .env from secrets
        run: |
          printf 'GETXAPI_KEY=%s\n'        "${{ secrets.GETXAPI_KEY }}"        > .env
          printf 'TWITTERAPI_IO_KEY=%s\n'  "${{ secrets.TWITTERAPI_IO_KEY }}"  >> .env

      - name: Backfill handle & write run report
        id: backfill
        env:
          PYTHONPATH: .
          # Backfill runs on twitterapi only (credits account). Single-provider
          # runs reconcile a lone terminal day straight to 'ok' (see
          # reconciler.reconcile_completed_days). Cross-provider verification is
          # intentionally skipped here; the daily delta uses getxapi.
          WORKER_POOL_SIZES: '{"twitterapi": 5}'
        run: |
          ARGS=("${{ inputs.handle }}")
          if [ -n "${{ inputs.since }}" ] || [ -n "${{ inputs.until }}" ]; then
            ARGS+=(--since "${{ inputs.since }}" --until "${{ inputs.until }}")
          fi
          if [ "${{ inputs.reset_failed }}" = "true" ]; then
            ARGS+=(--reset-failed)
          fi
          python scripts/run_backfill.py "${ARGS[@]}"

      # Commit even if the backfill step failed (if: always) so partial progress
      # is never lost — stage only the DB file, never `git add -A`.
      - name: Commit updated fintwit.db to main
        if: always()
        run: |
          test -f data/fintwit.db || { echo "data/fintwit.db not present — nothing to commit"; exit 0; }
          git config user.name  "fintwit-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage only the DB file — never git add -A.
          git add data/fintwit.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "FinTwit backfill ${{ inputs.handle }}: $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase origin main
          git push origin HEAD:main
