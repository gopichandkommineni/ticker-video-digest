name: FinTwit Daily Delta

on:
  schedule:
    - cron: "0 6 * * *"   # 2am ET — runs before the snapshots.db refresh at 0 13
  workflow_dispatch:

# R1: all .db-writing workflows share one concurrency group; queue, never cancel.
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      # R4: write secrets to .env; never echo them.
      - name: Write .env from secrets
        run: |
          printf 'GETXAPI_KEY=%s\n'        "${{ secrets.GETXAPI_KEY }}"        > .env
          printf 'TWITTERAPI_IO_KEY=%s\n'  "${{ secrets.TWITTERAPI_IO_KEY }}"  >> .env

      - name: Run ingest_all and report outcomes
        id: ingest
        run: |
          python - <<'PYEOF'
          import os, sys
          from dotenv import load_dotenv
          load_dotenv()

          from storage import close_connection
          from orchestration.runner import ingest_all

          results = ingest_all()

          # Per-handle summary
          counts = {"ok": 0, "failed": 0, "incomplete": 0, "skipped": 0}
          print("\n── FinTwit ingest summary ──")
          for r in results:
              bucket = r.outcome if r.outcome in counts else "failed"
              counts[bucket] += 1
              detail = ""
              if r.outcome == "ok":
                  detail = f"inserted={r.inserted} ignored={r.ignored} watermark={r.watermark}"
              elif r.outcome == "incomplete":
                  detail = f"inserted={r.inserted} reason={r.reason!r} (will retry tomorrow)"
              elif r.outcome == "failed":
                  detail = f"error={r.error!r}"
              elif r.outcome == "skipped":
                  detail = f"reason={r.reason!r}"
              flag = "✓" if r.outcome == "ok" else ("~" if r.outcome in ("skipped", "incomplete") else "✗")
              print(f"  {flag} {r.handle}: {r.outcome}  {detail}")

          print(f"\n  ok={counts['ok']} failed={counts['failed']} "
                f"incomplete={counts['incomplete']} skipped={counts['skipped']}")

          # R2: WAL checkpoint before git commit.
          close_connection()

          # GitHub job summary
          summary_lines = [
              "## FinTwit Daily Delta",
              f"| outcome | count |",
              f"|---------|-------|",
              f"| ✓ ok | {counts['ok']} |",
              f"| ~ incomplete | {counts['incomplete']} |",
              f"| ~ skipped | {counts['skipped']} |",
              f"| ✗ failed | {counts['failed']} |",
          ]
          if counts["failed"] or counts["incomplete"]:
              summary_lines.append("")
              summary_lines.append("### Handles needing attention")
              for r in results:
                  if r.outcome in ("failed", "incomplete"):
                      summary_lines.append(f"- **{r.handle}**: {r.outcome} — "
                                           f"{r.error or r.reason or ''}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "w") as f:
              f.write("\n".join(summary_lines) + "\n")

          # Exit non-zero if any handle failed or is stuck incomplete.
          # .db is already checkpointed above; commit step runs unconditionally.
          if counts["failed"] or counts["incomplete"]:
              sys.exit(1)
          PYEOF

      # R2+R3: commit .db unconditionally (partial progress must persist even on failure).
      - name: Commit data/fintwit.db if changed
        if: always()
        run: |
          git config user.name  "fintwit-bot"
          git config user.email "bot@users.noreply.github.com"
          # R3: only the db file — never git add -A
          git add data/fintwit.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "FinTwit delta: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Absorb any commit that landed while we ran (concurrency group makes this rare).
          git pull --rebase origin main
          git push origin HEAD:main
