name: FinTwit Daily Delta

on:
  schedule:
    - cron: "0 6 * * *"   # 2am ET — runs before the snapshots.db refresh at 0 13
  workflow_dispatch:

# R1: all .db-writing workflows share one concurrency group; queue, never cancel.
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      # R4: write secrets to .env in cwd; scripts load it with load_dotenv(".env").
      - name: Write .env from secrets
        run: |
          printf 'GETXAPI_KEY=%s\n'        "${{ secrets.GETXAPI_KEY }}"        > .env
          printf 'TWITTERAPI_IO_KEY=%s\n'  "${{ secrets.TWITTERAPI_IO_KEY }}"  >> .env

      - name: Run ingest_all and report outcomes
        id: ingest
        env:
          PYTHONPATH: .
        run: python scripts/run_daily.py

      # R2+R3: commit .db unconditionally (partial progress must persist even on failure).
      - name: Commit data/fintwit.db if changed
        if: always()
        run: |
          test -f data/fintwit.db || { echo "data/fintwit.db not present — nothing to commit"; exit 0; }
          git config user.name  "fintwit-bot"
          git config user.email "bot@users.noreply.github.com"
          # R3: only the db file — never git add -A
          git add data/fintwit.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "FinTwit delta: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Absorb any commit that landed while we ran (concurrency group makes this rare).
          git pull --rebase origin main
          git push origin HEAD:main
