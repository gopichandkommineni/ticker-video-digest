name: FinTwit — API Variance Probe

# On-demand diagnostic: fetches the same handle N times from each tweet provider
# and reports how stable/complete each provider's results are. Writes a verdict
# report under the Actions run ("Summary" tab) plus fixtures under research/probes/.

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "Twitter handle to probe (without @)"
        required: true
        type: string
      since:
        description: "Start date YYYY-MM-DD (default: Jan 1 of current year)"
        required: false
        type: string
      runs:
        description: "Number of repeat runs per provider (default: 3)"
        required: false
        default: "3"
        type: string

# Serialize with other db-writing workflows so probe commits don't race daily-delta.
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Write .env from secrets
        run: |
          printf 'GETXAPI_KEY=%s\n'        "${{ secrets.GETXAPI_KEY }}"        > .env
          printf 'TWITTERAPI_IO_KEY=%s\n'  "${{ secrets.TWITTERAPI_IO_KEY }}"  >> .env

      - name: Run variance probe & write verdict report
        env:
          PYTHONPATH: .
        run: |
          ARGS="${{ inputs.handle }}"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          ARGS="$ARGS --runs ${{ inputs.runs }}"
          python scripts/run_variance.py $ARGS

      - name: Commit probe fixtures + seeded fintwit.db to main
        if: always()
        run: |
          # Probe fixtures plus the seeded tweet DB (run_variance persists into
          # data/fintwit.db unless --no-persist). Never git add -A.
          git add research/probes/ data/fintwit.db
          git diff --cached --quiet && echo "Nothing to commit — skipping" && exit 0
          git config user.name  "fintwit-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "Probe + seed: variance ${{ inputs.handle }} $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
