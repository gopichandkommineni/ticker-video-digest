[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticker-digest"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "youtube-transcript-api",
    "anthropic",
    "pydantic>=2",
    "python-dotenv",
    "streamlit",
    "cryptography>=42.0",
    "cffi>=1.16",
    "yfinance>=0.2",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "lxml>=4.9",
    # Social media scrapers
    "praw>=7.0",
    "tweepy>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[project.scripts]
ticker-digest = "ticker_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ticker_digest*", "casino_dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require real network access (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
